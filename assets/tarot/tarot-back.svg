<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2504 4866" width="2504" height="4866">
  <!-- Background -->
  <rect width="2504" height="4866" rx="80" fill="#151515"/>
  
  <defs>
    <!-- Basic Ray Group for Sunburst -->
    <g id="ray">
       <line x1="0" y1="-320" x2="0" y2="-900" stroke="#cfad76" stroke-width="16" stroke-linecap="round"/>
       <line x1="0" y1="-320" x2="0" y2="-750" stroke="#cfad76" stroke-width="8" stroke-linecap="round" transform="rotate(11.25)"/>
       <line x1="0" y1="-320" x2="0" y2="-750" stroke="#cfad76" stroke-width="8" stroke-linecap="round" transform="rotate(-11.25)"/>
       <line x1="0" y1="-320" x2="0" y2="-600" stroke="#cfad76" stroke-width="12" stroke-linecap="round" transform="rotate(22.5)"/>
       <line x1="0" y1="-320" x2="0" y2="-500" stroke="#cfad76" stroke-width="6" stroke-linecap="round" transform="rotate(33.75)"/>
       <line x1="0" y1="-320" x2="0" y2="-500" stroke="#cfad76" stroke-width="6" stroke-linecap="round" transform="rotate(-33.75)"/>
    </g>

    <!-- Corner Ornament -->
    <g id="corner">
      <!-- Inner Corner Arc -->
      <path d="M 120 400 A 280 280 0 0 0 400 120" fill="none" stroke="#cfad76" stroke-width="24"/>
      <path d="M 120 460 A 340 340 0 0 0 460 120" fill="none" stroke="#cfad76" stroke-width="8"/>
      
      <!-- Corner Crescent -->
      <circle cx="200" cy="200" r="80" fill="#cfad76"/>
      <circle cx="230" cy="170" r="90" fill="#151515"/>
      
      <!-- Corner Rays -->
      <line x1="200" y1="200" x2="450" y2="200" stroke="#cfad76" stroke-width="10" stroke-linecap="round"/>
      <line x1="200" y1="200" x2="200" y2="450" stroke="#cfad76" stroke-width="10" stroke-linecap="round"/>
      <line x1="200" y1="200" x2="380" y2="380" stroke="#cfad76" stroke-width="16" stroke-linecap="round"/>
      
      <!-- Dots -->
      <circle cx="320" cy="200" r="20" fill="#cfad76"/>
      <circle cx="200" cy="320" r="20" fill="#cfad76"/>
      <circle cx="300" cy="300" r="24" fill="#cfad76"/>
      
      <!-- Side vines -->
      <path d="M 400 120 Q 600 120 600 300 T 800 300" fill="none" stroke="#cfad76" stroke-width="16" stroke-linecap="round"/>
      <path d="M 120 400 Q 120 600 300 600 T 300 800" fill="none" stroke="#cfad76" stroke-width="16" stroke-linecap="round"/>
      <path d="M 800 300 Q 900 300 900 400" fill="none" stroke="#cfad76" stroke-width="8" stroke-linecap="round"/>
      <path d="M 300 800 Q 300 900 400 900" fill="none" stroke="#cfad76" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Little diamonds -->
      <polygon points="600,240 660,300 600,360 540,300" fill="#cfad76"/>
      <polygon points="240,600 300,660 360,600 300,540" fill="#cfad76"/>
    </g>
  </defs>

  <!-- Outer Borders -->
  <rect x="80" y="80" width="2344" height="4706" rx="60" fill="none" stroke="#cfad76" stroke-width="32"/>
  <rect x="140" y="140" width="2224" height="4586" rx="40" fill="none" stroke="#cfad76" stroke-width="8"/>
  
  <!-- Angled Inner Frame -->
  <polygon points="400,800 800,400 1704,400 2104,800 2104,4066 1704,4466 800,4466 400,4066" fill="none" stroke="#cfad76" stroke-width="16"/>
  <polygon points="430,812 812,430 1692,430 2074,812 2074,4054 1692,4436 812,4436 430,4054" fill="none" stroke="#cfad76" stroke-width="6"/>

  <!-- Place Corners -->
  <use href="#corner" transform="translate(0,0)"/>
  <use href="#corner" transform="translate(2504,0) scale(-1, 1)"/>
  <use href="#corner" transform="translate(0,4866) scale(1, -1)"/>
  <use href="#corner" transform="translate(2504,4866) scale(-1, -1)"/>

  <!-- Left Center Ornament -->
  <g transform="translate(140, 2433)">
    <polygon points="0,-400 150,0 0,400" fill="#cfad76"/>
    <circle cx="200" cy="0" r="40" fill="#cfad76"/>
    <path d="M 0,-600 Q 200,-600 200,-300 T 400,0 T 200,300 T 0,600" fill="none" stroke="#cfad76" stroke-width="16" stroke-linecap="round"/>
  </g>
  
  <!-- Right Center Ornament -->
  <g transform="translate(2364, 2433) scale(-1, 1)">
    <polygon points="0,-400 150,0 0,400" fill="#cfad76"/>
    <circle cx="200" cy="0" r="40" fill="#cfad76"/>
    <path d="M 0,-600 Q 200,-600 200,-300 T 400,0 T 200,300 T 0,600" fill="none" stroke="#cfad76" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Top Center Ornament -->
  <g transform="translate(1252, 140)">
    <polygon points="-400,0 0,150 400,0" fill="#cfad76"/>
    <circle cx="0" cy="220" r="40" fill="#cfad76"/>
  </g>
  
  <!-- Bottom Center Ornament -->
  <g transform="translate(1252, 4726) scale(1, -1)">
    <polygon points="-400,0 0,150 400,0" fill="#cfad76"/>
    <circle cx="0" cy="220" r="40" fill="#cfad76"/>
  </g>

  <!-- Central Spine and Sunburst -->
  <g transform="translate(1252, 2433)">
    <!-- Dotted line spine -->
    <line x1="0" y1="-1800" x2="0" y2="1800" stroke="#cfad76" stroke-width="16" stroke-dasharray="24, 40" stroke-linecap="round"/>
    
    <!-- Sunburst Rays -->
    <use href="#ray" transform="rotate(0)"/>
    <use href="#ray" transform="rotate(45)"/>
    <use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(135)"/>
    <use href="#ray" transform="rotate(180)"/>
    <use href="#ray" transform="rotate(225)"/>
    <use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(315)"/>
    
    <!-- Dark center for sunburst -->
    <circle cx="0" cy="0" r="320" fill="#151515" stroke="#cfad76" stroke-width="20"/>
    
    <!-- Gold crescent in center -->
    <circle cx="0" cy="0" r="240" fill="#cfad76"/>
    <circle cx="60" cy="0" r="220" fill="#151515"/>
    
    <!-- Top Moon -->
    <circle cx="0" cy="-1400" r="160" fill="#cfad76"/>
    <circle cx="0" cy="-1480" r="140" fill="#151515"/>
    
    <!-- Upper Mid Full Moon -->
    <circle cx="0" cy="-800" r="220" fill="#151515" stroke="#cfad76" stroke-width="16"/>
    <circle cx="0" cy="-800" r="160" fill="#cfad76"/>
    
    <!-- Lower Mid Full Moon -->
    <circle cx="0" cy="800" r="220" fill="#151515" stroke="#cfad76" stroke-width="16"/>
    <circle cx="0" cy="800" r="160" fill="#cfad76"/>
    
    <!-- Bottom Moon -->
    <circle cx="0" cy="1400" r="160" fill="#cfad76"/>
    <circle cx="0" cy="1480" r="140" fill="#151515"/> <!-- Fixed cutout position for upward smile (U shape) or downward (n shape) -->
  </g>
</svg>
