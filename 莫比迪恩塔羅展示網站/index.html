<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="塔羅牌正逆位作品展示 — 藝術家數位作品集。探索每一張塔羅牌的正位與逆位創作。" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>TAROT — The Other Side of the Card</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>

  <!-- ════════════════════════════════════════
       NOISE OVERLAY
       ════════════════════════════════════════ -->
  <div class="noise-overlay" aria-hidden="true">
    <svg>
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>
  </div>

  <!-- ════════════════════════════════════════
       AMBIENT LIGHT
       ════════════════════════════════════════ -->
  <div class="ambient-light" aria-hidden="true"></div>


  <!-- ════════════════════════════════════════
       HEADER
       ════════════════════════════════════════ -->
  <header id="site-header" class="site-header">
    <a href="#" id="header-logo" class="header__logo">TAROT</a>
    <nav class="header__nav">
      <a href="#gallery" id="nav-gallery" class="header__nav-link">GALLERY</a>
      <a href="#about" id="nav-about" class="header__nav-link">ABOUT</a>
    </nav>
  </header>


  <!-- ════════════════════════════════════════
       HERO SECTION
       ════════════════════════════════════════ -->
  <section id="hero" class="hero">
    <h1 class="hero__title">TAROT</h1>
    <p class="hero__subtitle">THE OTHER SIDE OF THE CARD</p>

    <div class="hero__card-wrapper">
      <div id="hero-card" class="hero__card">
        <img class="hero-card__image hero__card-image"
             src=""
             alt=""
             style="opacity: 0; transition: opacity 0.6s ease;" />
      </div>
    </div>

    <div class="hero__scroll-hint" aria-hidden="true">
      <span class="hero__scroll-text">SCROLL</span>
      <div class="hero__scroll-line"></div>
    </div>
  </section>


  <!-- ════════════════════════════════════════
       GALLERY SECTION
       ════════════════════════════════════════ -->
  <section id="gallery" class="gallery">
    <div class="gallery__header">
      <p class="gallery__label">COLLECTION</p>
      <h2 class="gallery__title">Gallery</h2>
      <div class="gallery__divider"></div>
    </div>

    <div id="gallery-grid" class="gallery__grid">
      <!-- Cards are dynamically inserted by gallery.js -->
    </div>
  </section>


  <!-- ════════════════════════════════════════
       ABOUT SECTION
       ════════════════════════════════════════ -->
  <section id="about" class="about">
    <p class="about__label">ABOUT</p>
    <p class="about__text">
      每一張塔羅牌都擁有兩面——正位與逆位。<br />
      這個展覽呈現的是同一張牌的兩種面貌，<br />
      邀請你翻轉、凝視、感受。
    </p>
  </section>


  <!-- ════════════════════════════════════════
       FOOTER
       ════════════════════════════════════════ -->
  <footer class="site-footer">
    <p class="footer__text">© <span id="footer-year"></span> TAROT</p>
  </footer>


  <!-- ════════════════════════════════════════
       DETAIL OVERLAY
       ════════════════════════════════════════ -->
  <div id="detail-overlay" class="detail-overlay" role="dialog" aria-modal="true" aria-label="Tarot card detail view">

    <!-- Backdrop -->
    <div class="detail-overlay__backdrop"></div>

    <!-- Content -->
    <div class="detail-overlay__content">

      <!-- Detail Header -->
      <div class="detail-header">
        <button id="detail-back" class="detail-back" aria-label="Back to gallery">
          <span class="detail-back__arrow">←</span>
          <span class="detail-back__text">BACK TO GALLERY</span>
        </button>
        <span id="detail-counter" class="detail-counter">01 / 03</span>
      </div>

      <!-- Detail Main -->
      <div class="detail-main">

        <!-- Prev Arrow -->
        <button id="detail-prev" class="detail-nav detail-nav--prev" aria-label="Previous card">
          <span>‹</span>
        </button>

        <!-- Viewer: Card + Info -->
        <div class="detail-viewer">

          <!-- Card Area (swipe / tap / flip zone) -->
          <div id="detail-card-area" class="detail-card-area">
            <div id="detail-card-flip" class="detail-card-flip">
              <img id="detail-card-image"
                   class="detail-card-image"
                   src=""
                   alt="" />
            </div>
            <div class="detail-card-area__flip-hint">CLICK TO FLIP</div>
          </div>

          <!-- Info Panel -->
          <div id="detail-info" class="detail-info">
            <span id="detail-card-number" class="detail-info__number"></span>
            <h2 id="detail-card-name" class="detail-info__name"></h2>
            <span id="detail-card-status" class="detail-info__status">UPRIGHT</span>
            <div class="detail-info__divider"></div>
            <p id="detail-card-text" class="detail-info__text"></p>

            <!-- Toggle: UPRIGHT ● ─── ○ REVERSED -->
            <div class="detail-toggle">
              <button id="toggle-upright" class="detail-toggle__option active">UPRIGHT</button>
              <div class="detail-toggle__track">
                <div class="detail-toggle__indicator"></div>
              </div>
              <button id="toggle-reversed" class="detail-toggle__option">REVERSED</button>
            </div>
          </div>

        </div>

        <!-- Next Arrow -->
        <button id="detail-next" class="detail-nav detail-nav--next" aria-label="Next card">
          <span>›</span>
        </button>

      </div>

    </div>
  </div>


  <!-- ════════════════════════════════════════
       SCRIPTS (load order matters)
       ════════════════════════════════════════ -->
  <script src="js/tarotData.js"></script>
  <script src="js/utils/swipe.js"></script>
  <script src="js/utils/animations.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/hero.js"></script>
  <script src="js/components/gallery.js"></script>
  <script src="js/components/detail.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
